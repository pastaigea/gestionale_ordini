name: Backup e mantenimento Supabase

on:
  schedule:
    # Orario italiano esplicito; il minuto 23 evita il picco di inizio ora.
    - cron: "23 4 * * *"
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  keepalive:
    name: Heartbeat database
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://yhhaplwheykxumdmuajg.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_IbwVuU30_vuA6BltF08z_A_mCvKD57b' }}

    steps:
      - name: Registra attività giornaliera
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error title=URL Supabase non valido::Controllare la variabile VITE_SUPABASE_URL."
              exit 1
              ;;
          esac
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*|eyJ*) ;;
            *)
              echo "::error title=Publishable key non valida::Controllare VITE_SUPABASE_PUBLISHABLE_KEY."
              exit 1
              ;;
          esac

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 45 \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --output /dev/null \
            "${SUPABASE_URL%/}/rest/v1/rpc/keep_project_active"

          echo "### Heartbeat Supabase completato" >> "$GITHUB_STEP_SUMMARY"

  backup:
    name: Dump database cifrato
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Docker Official Image, minor e manifest bloccati. Fonte del digest:
      # https://hub.docker.com/_/postgres/tags?name=17.8-bookworm
      PG_DUMP_IMAGE: postgres:17.8-bookworm@sha256:45e40832755b7133da62e701ee496d65afc5e4527c8ff5446c2f3bdd11bc58e3

    steps:
      - name: Definisci percorsi temporanei
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "BACKUP_WORK_DIR=$RUNNER_TEMP/gestionale-ordini-supabase-backup"
            echo "BACKUP_ARCHIVE=$RUNNER_TEMP/gestionale-ordini-supabase-backup.tar.gz"
            echo "ENCRYPTED_BACKUP=$RUNNER_TEMP/gestionale-ordini-supabase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz.age"
          } >> "$GITHUB_ENV"

      - name: Verifica configurazione obbligatoria
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error title=Configurazione mancante::Aggiungere il secret Actions SUPABASE_DB_URL."
            exit 1
          fi

          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=Configurazione non valida::SUPABASE_DB_URL deve essere una connection string PostgreSQL."
              exit 1
              ;;
          esac

          case "$SUPABASE_DB_URL" in
            postgres://gestionale_backup.*:*@*:5432/*|postgresql://gestionale_backup.*:*@*:5432/*) ;;
            *)
              echo "::error title=Ruolo backup non valido::Usare gestionale_backup tramite Session pooler sulla porta 5432."
              exit 1
              ;;
          esac

          if [[ -z "${BACKUP_AGE_RECIPIENT:-}" ]]; then
            echo "::error title=Configurazione mancante::Aggiungere la variabile Actions BACKUP_AGE_RECIPIENT."
            exit 1
          fi

          case "$BACKUP_AGE_RECIPIENT" in
            age1*) ;;
            *)
              echo "::error title=Configurazione non valida::BACKUP_AGE_RECIPIENT deve essere una chiave pubblica age (age1...)."
              exit 1
              ;;
          esac

      - name: Installa age
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: Prepara area temporanea
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          if [[ -e "$BACKUP_WORK_DIR" || -e "$BACKUP_ARCHIVE" || -e "$ENCRYPTED_BACKUP" ]]; then
            echo "::error title=Area temporanea non vuota::Il workflow non sovrascrive file preesistenti."
            exit 1
          fi

          install -d -m 700 "$BACKUP_WORK_DIR"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          echo "artifact_name=supabase-db-${timestamp}-run-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Esporta schema e dati
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          umask 077

          clear_connection_env() {
            unset SUPABASE_DB_URL PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE PGSSLMODE
          }
          trap clear_connection_env EXIT

          # Il ruolo creato dallo script locale usa una password alfanumerica:
          # la URL puo quindi essere separata senza decodifiche ambigue. Il
          # container riceve solo nomi di variabili, mai valori negli argomenti.
          connection_without_scheme="${SUPABASE_DB_URL#*://}"
          connection_credentials="${connection_without_scheme%%@*}"
          connection_endpoint="${connection_without_scheme#*@}"
          connection_port_path="${connection_endpoint#*:}"
          connection_database_query="${connection_port_path#*/}"

          export PGUSER="${connection_credentials%%:*}"
          export PGPASSWORD="${connection_credentials#*:}"
          export PGHOST="${connection_endpoint%%:*}"
          export PGPORT="${connection_port_path%%/*}"
          export PGDATABASE="${connection_database_query%%\?*}"
          export PGSSLMODE=require
          unset SUPABASE_DB_URL

          if [[ "$PGUSER" != gestionale_backup.* ]] \
            || [[ "$PGHOST" != "aws-0-eu-central-1.pooler.supabase.com" ]] \
            || [[ "$PGPORT" != "5432" ]] \
            || [[ "$PGDATABASE" != "postgres" ]] \
            || [[ ! "$PGPASSWORD" =~ ^[A-Za-z0-9]{64}$ ]]; then
            echo "::error title=Connection string non valida::Formato del ruolo backup inatteso."
            exit 1
          fi

          dump_or_fail() {
            local label="$1"
            local destination="$2"
            shift 2
            local error_file="$BACKUP_WORK_DIR/.pg-dump-${label}.stderr"
            local category="errore_non_classificato"

            if docker run \
              --rm \
              --network host \
              --env PGHOST \
              --env PGPORT \
              --env PGUSER \
              --env PGPASSWORD \
              --env PGDATABASE \
              --env PGSSLMODE \
              "$PG_DUMP_IMAGE" \
              pg_dump \
              --format=plain \
              --no-owner \
              "$@" \
              > "$destination" \
              2> "$error_file"; then
              rm -f -- "$error_file"
              return 0
            fi

            if grep -Eqi 'password authentication failed|no password supplied|SASL authentication' "$error_file"; then
              category="autenticazione_database_fallita"
            elif grep -Eqi 'permission denied|insufficient privilege|must be owner' "$error_file"; then
              category="permesso_lettura_insufficiente"
            elif grep -Eqi 'must be (a )?superuser|superuser required' "$error_file"; then
              category="privilegio_superuser_richiesto"
            elif grep -qi 'read-only transaction' "$error_file"; then
              category="operazione_non_compatibile_con_sola_lettura"
            elif grep -Eqi 'server version.*pg_dump version|aborting because of server version mismatch' "$error_file"; then
              category="versione_pg_dump_non_compatibile"
            elif grep -Eqi 'could not connect|connection .*failed|connection refused|timeout expired|connection timed out|network is unreachable|server closed the connection' "$error_file"; then
              category="connessione_database_fallita"
            elif grep -Eqi 'SSL SYSCALL|certificate verify failed|TLS' "$error_file"; then
              category="connessione_tls_fallita"
            elif grep -Eqi 'no matching schemas were found|does not exist|not found' "$error_file"; then
              category="oggetto_database_mancante"
            elif grep -Eqi 'docker:|manifest unknown|pull access denied|unable to find image' "$error_file"; then
              category="runtime_container_fallito"
            fi

            # Non stampare mai stderr: libpq potrebbe includervi dettagli della
            # connessione. Rimuovere anche l'eventuale dump parziale.
            rm -f -- "$destination" "$error_file"
            echo "::error title=Dump ${label} fallito::Categoria: ${category}."
            return 1
          }

          docker pull "$PG_DUMP_IMAGE"
          pg_dump_version="$(docker run --rm "$PG_DUMP_IMAGE" pg_dump --version)"
          case "$pg_dump_version" in
            "pg_dump (PostgreSQL) 17."*) ;;
            *)
              echo "::error title=Versione pg_dump non valida::Il backup richiede PostgreSQL 17."
              exit 1
              ;;
          esac

          dump_or_fail schema "$BACKUP_WORK_DIR/schema.sql" \
            --schema-only \
            --schema public \
            --schema private

          dump_or_fail dati "$BACKUP_WORK_DIR/data.sql" \
            --data-only \
            --schema public \
            --schema private \
            --schema auth \
            --schema storage \
            --exclude-table-data auth.schema_migrations \
            --exclude-table-data storage.migrations \
            --exclude-table-data storage.buckets_vectors \
            --exclude-table-data storage.vector_indexes

          dump_or_fail storico-schema "$BACKUP_WORK_DIR/history_schema.sql" \
            --schema-only \
            --schema supabase_migrations

          dump_or_fail storico-dati "$BACKUP_WORK_DIR/history_data.sql" \
            --data-only \
            --schema supabase_migrations

          for dump_file in schema.sql data.sql history_schema.sql history_data.sql; do
            if [[ ! -s "$BACKUP_WORK_DIR/$dump_file" ]]; then
              echo "::error title=Dump incompleto::$dump_file non esiste o e vuoto."
              exit 1
            fi
          done

          {
            echo "format_version=3"
            printf 'created_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'pg_dump_image=%s\n' "$PG_DUMP_IMAGE"
            printf 'pg_dump_version=%s\n' "$pg_dump_version"
          } > "$BACKUP_WORK_DIR/manifest.txt"

          (
            cd "$BACKUP_WORK_DIR"
            sha256sum \
              schema.sql data.sql \
              history_schema.sql history_data.sql manifest.txt \
              > SHA256SUMS
          )

      - name: Comprimi e cifra il backup
        id: encrypt
        shell: bash
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          umask 077

          tar \
            --create \
            --gzip \
            --file "$BACKUP_ARCHIVE" \
            --directory "$BACKUP_WORK_DIR" \
            schema.sql data.sql \
            history_schema.sql history_data.sql manifest.txt SHA256SUMS

          age \
            --encrypt \
            --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "$ENCRYPTED_BACKUP" \
            "$BACKUP_ARCHIVE"

          if [[ ! -s "$ENCRYPTED_BACKUP" ]]; then
            echo "::error title=Cifratura non riuscita::Il file cifrato non esiste o e vuoto."
            exit 1
          fi

          chmod 600 "$ENCRYPTED_BACKUP"
          encrypted_sha256="$(sha256sum "$ENCRYPTED_BACKUP" | cut -d ' ' -f 1)"
          echo "sha256=$encrypted_sha256" >> "$GITHUB_OUTPUT"

          # Il testo in chiaro non deve sopravvivere fino allo step di upload.
          rm -f -- "$BACKUP_ARCHIVE"
          rm -rf -- "$BACKUP_WORK_DIR"

      - name: Calcola conservazione
        id: retention
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$(TZ=Europe/Rome date +'%u')" == "7" ]]; then
            echo "days=90" >> "$GITHUB_OUTPUT"
            echo "label=settimanale" >> "$GITHUB_OUTPUT"
          else
            echo "days=14" >> "$GITHUB_OUTPUT"
            echo "label=giornaliero" >> "$GITHUB_OUTPUT"
          fi

      - name: Carica esclusivamente il backup cifrato
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ env.ENCRYPTED_BACKUP }}
          if-no-files-found: error
          retention-days: ${{ steps.retention.outputs.days }}
          compression-level: 0

      - name: Registra esito
        shell: bash
        run: |
          {
            echo "### Backup Supabase completato"
            echo
            echo "- Tipo: ${{ steps.retention.outputs.label }}"
            echo "- Conservazione: ${{ steps.retention.outputs.days }} giorni"
            echo "- SHA-256 del file age: \`${{ steps.encrypt.outputs.sha256 }}\`"
            echo "- Artifact: [apri backup cifrato](${{ steps.upload.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Elimina sempre i file temporanei
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          backup_work_dir="${BACKUP_WORK_DIR:-$RUNNER_TEMP/gestionale-ordini-supabase-backup}"
          backup_archive="${BACKUP_ARCHIVE:-$RUNNER_TEMP/gestionale-ordini-supabase-backup.tar.gz}"
          encrypted_backup="${ENCRYPTED_BACKUP:-$RUNNER_TEMP/gestionale-ordini-supabase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz.age}"

          for temporary_path in "$backup_work_dir" "$backup_archive" "$encrypted_backup"; do
            if [[ "$temporary_path" != "$RUNNER_TEMP/"* ]]; then
              echo "::error title=Cleanup rifiutato::Percorso esterno a RUNNER_TEMP."
              exit 1
            fi
          done

          rm -rf -- "$backup_work_dir"
          rm -f -- "$backup_archive" "$encrypted_backup"
